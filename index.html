<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Counting App</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      .app {
        width: min(92vw, 480px);
        background: #ffffff;
        border: 3px solid #111111;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 20px;
      }

      .count {
        font-size: 5rem;
        font-weight: 700;
        margin: 8px 0 20px;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
      }

      button {
        font-size: 2rem;
        font-weight: 700;
        padding: 16px;
        border: 3px solid #111111;
        border-radius: 10px;
        cursor: pointer;
        background: #ffffff;
      }

      button:focus-visible {
        outline: 4px solid #005fcc;
        outline-offset: 2px;
      }

      .reset {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <h1>Counting App</h1>
      <div id="count" class="count">0</div>
      <div class="buttons">
        <button id="decrease" type="button" aria-label="Decrease count by one">-1</button>
        <button id="increase" type="button" aria-label="Increase count by one">+1</button>
      </div>
      <button id="reset" class="reset" type="button">Reset</button>
    </main>

    <script>
      const countDisplay = document.getElementById("count");
      const increaseButton = document.getElementById("increase");
      const decreaseButton = document.getElementById("decrease");
      const resetButton = document.getElementById("reset");

      let count = 0;

      const renderCount = () => {
        countDisplay.textContent = String(count);
      };

      increaseButton.addEventListener("click", () => {
        count += 1;
        renderCount();
      });

      decreaseButton.addEventListener("click", () => {
        count -= 1;
        renderCount();
      });

      resetButton.addEventListener("click", () => {
        count = 0;
        renderCount();
      });
    </script>
  </body>
</html>
